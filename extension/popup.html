<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Little Later</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main id="app">
    <!-- Loading -->
    <section id="v-load" class="view center">
      <div class="dots"><i></i><i></i><i></i></div>
    </section>

    <!-- Signed out -->
    <section id="v-signin" class="view" hidden>
      <div class="hero">
        <img src="icons/lil.svg" alt="" class="mascot" />
        <h1>Save it now.<br /><span>Enjoy it later.</span></h1>
        <p class="sub">Sign in with the same account as the Little Later app.</p>
      </div>
      <button id="google" class="btn ghost" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5L6.4 10C7.2 7.8 9.4 6 12 6z"/></svg>
        Continue with Google
      </button>
      <div class="or"><span>or</span></div>
      <form id="login" autocomplete="on">
        <label class="field"><svg viewBox="0 0 24 24"><path d="M4 6.5h16v11H4z"/><path d="M4.5 7l7.5 6 7.5-6"/></svg><input id="email" type="email" placeholder="Email" autocomplete="email" required /></label>
        <label class="field"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg><input id="password" type="password" placeholder="Password" autocomplete="current-password" required /></label>
        <p id="login-err" class="err" role="alert"></p>
        <button id="login-btn" class="btn primary" type="submit">Sign in</button>
      </form>
      <p class="foot">No account yet? <a id="get-app" href="#">Get the app</a></p>
    </section>

    <!-- Save -->
    <section id="v-save" class="view" hidden>
      <header class="top">
        <div class="me"><span id="avatar" class="avatar">A</span><div><b id="me-name">You</b><small id="me-email"></small></div></div>
        <button id="menu" class="circ" type="button" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg></button>
        <div id="menu-pop" class="pop" hidden>
          <button id="open-app" type="button">Get the phone app</button>
          <button id="signout" type="button" class="danger">Sign out</button>
        </div>
      </header>

      <div class="tabs" role="tablist">
        <button id="tab-save" type="button" role="tab" class="on">Save</button>
        <button id="tab-saved" type="button" role="tab">My links</button>
      </div>

      <div id="pane-save">
      <div id="page" class="page">
        <div id="cover" class="cover"><span id="cover-letter">•</span><img id="cover-img" alt="" hidden /></div>
        <div class="page-txt">
          <textarea id="title" rows="2" maxlength="140" aria-label="Title"></textarea>
          <small id="domain"></small>
        </div>
      </div>
      <p id="unsavable" class="note-warn" hidden>This page can’t be saved. Open a normal website and try again.</p>

      <h2>Folder</h2>
      <div id="folders" class="chips"></div>

      <button id="add-remind" class="link-btn" type="button">Remind me</button>
      <div id="remind-box" hidden>
      <h2>Remind me</h2>
      <div id="when" class="tiles">
        <button type="button" data-w="today"><b>Today</b><small id="w-today"></small></button>
        <button type="button" data-w="tomorrow"><b>Tomorrow</b><small>9:00 am</small></button>
        <button type="button" data-w="date"><b>Pick a date</b><small id="w-date">Any day</small></button>
        <button type="button" data-w="none"><b>No reminder</b><small>Just save it</small></button>
      </div>
      <div id="when-edit" class="when-edit" hidden>
        <input id="w-day" type="date" aria-label="Day" />
        <input id="w-time" type="time" step="300" aria-label="Time" />
      </div>
      </div>

      <button id="add-note" class="link-btn" type="button">Add a note</button>
      <textarea id="note" rows="2" maxlength="300" placeholder="Why you saved it, what to look for…" hidden></textarea>

      <p id="save-err" class="err" role="alert"></p>
      <button id="save" class="btn primary big" type="button">Save for later</button>

      <div id="recent-wrap" hidden>
        <h2>Recent</h2>
        <ul id="recent" class="recent"></ul>
      </div>
      </div>

      <div id="pane-saved" hidden>
        <div id="lib-folders" class="chips scroll"></div>
        <p id="lib-note" class="lib-note"></p>
        <ul id="lib" class="recent lib"></ul>
        <p id="lib-empty" class="empty" hidden>No links here yet.</p>
      </div>
    </section>

    <!-- Saved -->
    <section id="v-done" class="view center" hidden>
      <div class="pop-in">
        <img src="icons/lil-happy.svg" alt="" class="mascot big" />
        <h1 id="done-title">Saved!</h1>
        <p id="done-sub" class="sub"></p>
      </div>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
