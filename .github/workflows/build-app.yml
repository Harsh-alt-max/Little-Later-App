name: Build app

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-app.yml']
  pull_request:
    paths: ['app/**']
  workflow_dispatch:

permissions:
  contents: write # publishes the APK/AAB as a GitHub Release (the website links to it)

env:
  FLUTTER_VERSION: '3.50.0'
  # SHA-256 of the Little Later signing certificate. Every release must match it,
  # or phones that already have the app will refuse the update.
  CERT_SHA256: '59c78344f7947929ff143fa678f4d242c6d29ecb07214f3dd87c8cc1a3250ad6'

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/today_test.dart test/screens_test.dart

      - name: Set up signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are missing, so this build is NOT published. Add them in Settings → Secrets and variables → Actions."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-littlelater}" "$KEYSTORE_PASSWORD" > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK and AAB
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          DEFINES="--dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
          BUILD="--build-number=$((100 + GITHUB_RUN_NUMBER))"
          flutter build apk --release --target-platform android-arm,android-arm64 $BUILD $DEFINES
          flutter build appbundle --release $BUILD $DEFINES

      - name: Check signing certificate
        if: steps.signing.outputs.signed == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          [ "$GOT" = "$CERT_SHA256" ] || { echo "::error::Signed with the wrong key ($GOT)"; exit 1; }

      - name: Collect files
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/Little-Later.apk
          cp build/app/outputs/bundle/release/app-release.aab ../dist/Little-Later.aab
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VER=$VER" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: little-later-${{ env.VER }}-${{ github.run_number }}
          path: dist/

      - name: Publish release (website download link)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-${{ github.run_number }}
          name: Little Later ${{ env.VER }} (build ${{ github.run_number }})
          make_latest: 'true'
          files: |
            dist/Little-Later.apk
            dist/Little-Later.aab

      - name: Remove signing files
        if: always()
        run: rm -f android/release.jks android/key.properties
