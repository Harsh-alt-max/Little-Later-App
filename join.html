<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0c">
<title>Join a folder · Little Later</title>
<meta property="og:title" content="You’re invited to a Little Later folder">
<meta property="og:image" content="https://harsh-alt-max.github.io/Little-Later-App/img/og.png">
<link rel="icon" href="icon.png">
<style>
@font-face{font-family:Geist;font-weight:400;src:url(fonts/Geist-Regular.ttf)}@font-face{font-family:Geist;font-weight:500;src:url(fonts/Geist-Medium.ttf)}@font-face{font-family:Geist;font-weight:600;src:url(fonts/Geist-SemiBold.ttf)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#0a0a0c radial-gradient(70% 45% at 50% 25%,rgba(255,159,126,.18),transparent 70%);color:#f4f1ec;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:380px;padding:30px 24px 26px;border-radius:32px;background:#121216;text-align:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 30px 70px rgba(0,0,0,.5)}
img{width:120px;height:120px;margin:-92px auto 4px;display:block;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{font-size:26px;font-weight:600;line-height:1.2;letter-spacing:-.03em;margin:6px 0 10px}
.folder{display:inline-flex;align-items:center;gap:8px;margin:4px 0 22px;padding:8px 14px;border-radius:99px;background:rgba(255,159,126,.14);color:#ffb59a;font-weight:600}
p{color:rgba(244,241,236,.6);font-size:14px;line-height:1.5;margin:14px 0 0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:99px;font-weight:600;font-size:16px;text-decoration:none}
.primary{background:#ff9f7e;color:#17130f;box-shadow:0 14px 34px -10px rgba(255,159,126,.6)}
.ghost{margin-top:10px;background:#202026;color:#f4f1ec}
</style>
</head>
<body>
<div class="card">
  <img src="img/lil-happy.svg" alt="">
  <h1 id="h">You’re invited</h1>
  <div class="folder" id="f">Shared folder</div>
  <a class="btn primary" id="open" href="#">Open in Little Later</a>
  <a class="btn ghost" href="./">Get the app</a>
  <p>Don’t have Little Later yet? Get the app first, sign in, then come back and tap the invite link again.</p>
</div>
<script>
const q=new URLSearchParams(location.search);
const cid=q.get('cid')||'',folder=q.get('join')||'Shared folder',by=q.get('by')||'';
document.getElementById('h').textContent=by?`${by} invited you`:'You’re invited';
document.getElementById('f').textContent=folder;
const params=new URLSearchParams({cid,join:folder});if(by)params.set('by',by);
const deep=`littlelater://join?${params}`;
const isAndroid=/Android/i.test(navigator.userAgent);
const site=location.href.replace(/join\.html.*$/,'');
document.getElementById('open').href=isAndroid
  ?`intent://join?${params}#Intent;scheme=littlelater;package=com.littlelater.app;S.browser_fallback_url=${encodeURIComponent(site)};end`
  :deep;
if(!cid){document.getElementById('open').style.display='none'}
</script>
</body>
</html>
