<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sign in · Little Later</title>
  <link rel="icon" href="icon.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; background: #0A0A0C radial-gradient(90% 50% at 50% 0, rgba(255,159,126,.14), transparent 70%); color: #F4F1EC; font: 400 15px/1.5 Geist, system-ui, sans-serif; padding: 20px; }
    .card { width: 100%; max-width: 400px; text-align: center; background: #141418; border-radius: 32px; padding: 32px 22px 24px; }
    img { width: 84px; height: 84px; border-radius: 22px; }
    h1 { font-size: 28px; font-weight: 600; letter-spacing: -.03em; margin: 14px 0 6px; }
    p { color: rgba(244,241,236,.55); }
    .btn { margin-top: 22px; width: 100%; height: 56px; border: 0; border-radius: 99px; font: 600 16px Geist, sans-serif; display: flex; gap: 10px; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; }
    .g { background: #F4F1EC; color: #0A0A0C; }
    .back { background: #FF9F7E; color: #17130F; }
    .btn:disabled { opacity: .6; }
    .err { color: #FF8A7A; margin-top: 14px; font-weight: 500; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <img src="icon.png" alt="" />
    <h1 id="h">Sign in to Little Later</h1>
    <p id="p">Pick your Google account. You’ll go straight back to the app.</p>
    <button id="go" class="btn g" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5L6.4 10C7.2 7.8 9.4 6 12 6z"/></svg>
      Continue with Google
    </button>
    <a id="back" class="btn back" hidden href="#">Back to Little Later</a>
    <p id="err" class="err" role="alert"></p>
  </main>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

    const app = initializeApp({ apiKey: 'AIzaSyB892SNxeXdCML_APdGchJzF6k6hAVtbsE', authDomain: 'littlelater-61969.firebaseapp.com', projectId: 'littlelater-61969' });
    const auth = getAuth(app);
    const $ = (id) => document.getElementById(id);

    $('go').onclick = async () => {
      $('err').textContent = '';
      $('go').disabled = true;
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const res = await signInWithPopup(auth, provider);
        const cred = GoogleAuthProvider.credentialFromResult(res);
        const q = new URLSearchParams();
        if (cred?.idToken) q.set('id', cred.idToken);
        if (cred?.accessToken) q.set('at', cred.accessToken);
        const link = `intent://auth?${q}#Intent;scheme=littlelater;package=com.littlelater.app;end`;
        $('h').textContent = 'You’re in!';
        $('p').textContent = `Signed in as ${res.user.email}. Taking you back…`;
        $('go').hidden = true;
        $('back').href = link;
        $('back').hidden = false;
        signOut(auth).catch(() => {});
        location.href = link;
      } catch (e) {
        const c = e?.code || '';
        $('err').textContent = c.includes('popup-closed') || c.includes('cancelled') ? 'The Google window was closed. Tap the button to try again.'
          : c.includes('popup-blocked') ? 'Your browser blocked the Google window. Tap the button again.'
          : 'Sign-in didn’t work. Tap the button to try again.';
      } finally {
        $('go').disabled = false;
      }
    };
  </script>
</body>
</html>
